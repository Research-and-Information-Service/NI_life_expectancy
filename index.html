<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NI DEA Life Expectancy Map</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js -->
  <script src="https://unpkg.com/chart.js@4.3.0/dist/chart.umd.js"></script>

  <!-- Chart.js Annotation Plugin -->
  <script src="https://unpkg.com/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <script>Chart.register(window['chartjs-plugin-annotation']);</script>

  <style>
    :root{
      --control-width: 220px;
      --control-font: 13px;
      --sidebar-width: 360px;
      --chart-height: 220px;
      --ui-bg: rgba(255,255,255,0.98);
      --muted: #666;
      --accent: #0078A8;
      --legend-width: 160px;
    }

    html,body { height:100%; margin:0; font-family: Arial, sans-serif; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
    #map { height:100vh; width:100%; }

    /* Controls */
    .controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1200;
      background: var(--ui-bg);
      padding: 8px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
      width: var(--control-width);
      font-size: var(--control-font);
      transition: transform .18s ease, opacity .18s ease;
    }
    .controls.min { transform: translateY(-6px) scale(.98); opacity:.94; }
    .control-toggle { position:absolute; right:6px; top:6px; border:none; background:transparent; cursor:pointer; color:var(--muted); font-size:14px; }

    .tabs { display:flex; gap:6px; margin-bottom:6px; }
    .tabs button { flex:1; padding:6px 8px; border: none; background:#eee; border-radius:4px; cursor:pointer; }
    .tabs button.active { background:var(--accent); color:white; }

    #year-slider { width:100%; margin-top:8px; }
    #year-label { margin-top:6px; font-weight:700; font-size:13px; }
    #play-btn { margin-top:8px; padding:6px 10px; background:#eee; border-radius:4px; cursor:pointer; border:none; }

    .small-note { font-size:12px; color:var(--muted); margin-top:8px; }

    /* Tooltip (info) */
    .info { display:inline-block; border-radius:50%; width:18px; height:18px; text-align:center; line-height:18px; font-size:12px; background:#f0f0f0; color:#333; margin-left:6px; cursor:help; position:relative; }
    .info-tip { display:none; position:absolute; left:22px; top:-6px; width:240px; background:#fff; border:1px solid #ddd; padding:8px; font-size:12px; color:#222; border-radius:4px; box-shadow:0 2px 6px rgba(0,0,0,0.12); z-index:2500; }
    .info:hover .info-tip { display:block; }

    /* =========================
   LEGEND
   ========================= */
.legend {
  width: auto;           
  min-width: 0;          
  padding: 6px 8px;      
  line-height: 1.3;
  font-size: 12px;
  background: rgba(255,255,255,0.95);
  border-radius: 6px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.12);
}

.legend-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;             
  margin-bottom: 4px;   
}

.legend-swatch {
  width: 18px;           
  height: 14px;
  border-radius: 3px;
  flex: 0 0 auto;
}

.legend-item > div {
  white-space: nowrap;   
}

    /* Sidebar */
    #sidebar {
      position:absolute; right:10px; top:10px;
      z-index:1200;
      width:var(--sidebar-width);
      max-height: calc(100vh - 20px);
      overflow:auto;
      background: var(--ui-bg);
      padding:10px;
      border-radius:6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
      display:none;
    }
    #sidebar h3 { margin:0 0 6px 0; font-size:16px; }
    #sidebar-meta { margin-bottom:8px; color:var(--muted); font-size:13px; }
    #chart-container { height:var(--chart-height); }

    /* label for selected DEA (divIcon) */
    .dea-label {
      display:inline-block;
      font-weight:700;
      font-size:13px;
      line-height:1;
      padding:6px 8px;
      border-radius:6px;
      background: rgba(255,255,255,0.9);
      color:#111;
      text-align:center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      text-shadow:
         -1px -1px 0 #fff,
         1px -1px 0 #fff,
         -1px 1px 0 #fff,
         1px 1px 0 #fff;
      transform: translate(-50%,-50%);
      pointer-events:none;
    }

    /* Spinner */
    #spinner { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2000; display:none; }
    .spinner-dot { width:14px; height:14px; margin:4px; border-radius:50%; background:var(--accent); display:inline-block; animation: spin 0.9s linear infinite; }
    @keyframes spin { 0%{transform:scale(1);}50%{transform:scale(.45);}100%{transform:scale(1);} }

    /* Logo */
    #assembly-logo { position:absolute; bottom:10px; left:10px; width:120px; z-index:1100; opacity:0.95; pointer-events:none; }

  </style>
</head>
<body>

  <div id="map"></div>
  <img id="assembly-logo" src="NI_Assembly.svg" alt="NI Assembly Logo" />

  <div id="spinner"><div class="spinner-dot"></div><div class="spinner-dot" style="animation-delay:.12s"></div><div class="spinner-dot" style="animation-delay:.24s"></div></div>

  <!-- Controls -->
  <div class="controls" id="controls">
    <button class="control-toggle" id="controls-toggle" title="Collapse controls">▾</button>
    <div class="tabs">
      <button id="tab-males" class="active">Males</button>
      <button id="tab-females">Females</button>
    </div>
    <input type="range" id="year-slider" min="0" max="0" step="1" />
    <div id="year-label"></div>
    <button id="play-btn">▶ Play Years</button>
  </div>

  <!-- Sidebar -->
  <div id="sidebar">
    <button id="close-sidebar" style="float:right">Close</button>
    <h3 id="sidebar-title"></h3>
    <div id="sidebar-meta"></div>
    <div id="chart-container">
      <canvas id="deaChart"></canvas>
    </div>
  </div>

<script>
// =========================
// CONFIG & STATE
// =========================
const colors = ["#28326f","#25588e","#2285b3","#86bad4","#dee8f1"];
const geojsonUrl = "DEA_data.geojson";
let selectedSex = "Males", years=[], currentYearIndex=0, yAxisMode="fixed";
let deaDataCache=null, deaLayer=null, lastSelectedLayer=null, selectedLabelMarker=null, deaChart=null;
let playInterval=null, breaks=[], globalMinValue=null, globalMaxValue=null;

// =========================
// MAP INIT WITH DYNAMIC ELASTIC BOUNDS
// =========================
const map = L.map('map', { preferCanvas:true, maxBoundsViscosity:1.0 });
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', { attribution:'&copy; OpenStreetMap & Carto' }).addTo(map);
map.setMaxZoom(14);

function applyElasticBounds(bounds){
  const elasticFactor = (L.Browser.touch) ? 0.06 : 0.03;
  const sw = bounds.getSouthWest(), ne = bounds.getNorthEast();
  const latDiff = ne.lat - sw.lat, lngDiff = ne.lng - sw.lng;
  const elasticBounds = L.latLngBounds(
    [sw.lat - latDiff*elasticFactor, sw.lng - lngDiff*elasticFactor],
    [ne.lat + latDiff*elasticFactor, ne.lng + lngDiff*elasticFactor]
  );
  map.setMaxBounds(elasticBounds);
  map.invalidateSize(true);
  const minZoom = map.getBoundsZoom(bounds, true);
  map.setMinZoom(minZoom);
  map.panInsideBounds(bounds, { animate:false });
}

// =========================
// LOAD DEA GEOJSON
// =========================
showSpinner(true);
fetch(geojsonUrl)
  .then(r => { if(!r.ok) throw new Error('GeoJSON load failed'); return r.json(); })
  .then(data=>{
    deaDataCache = data;
    // collect years
    const yearSet = new Set();
    deaDataCache.features.forEach(f=>(f.properties.data||[]).forEach(d=>yearSet.add(String(d.GroupedYear))));
    years = Array.from(yearSet).sort();
    document.getElementById('year-slider').max = years.length - 1;
    updateYearLabel();
    computeGlobalBounds(); computeGlobalBreaks();
    createMapLayer(); updateLegend();
    const deaBounds = deaLayer.getBounds();
    map.fitBounds(deaBounds, { padding:[18,18] });
    applyElasticBounds(deaBounds);
    window.addEventListener('resize', ()=>setTimeout(()=>applyElasticBounds(deaBounds),150));
    showSpinner(false);
  }).catch(err=>{ console.error(err); showSpinner(false); alert('Error loading data: '+err.message); });

// =========================
// HELPER FUNCTIONS
// =========================
function showSpinner(on=true){ document.getElementById('spinner').style.display = on?'block':'none'; }
function round1(v){ return (typeof v==='number')?Math.round(v*10)/10:v; }
function updateYearLabel(){ document.getElementById('year-label').textContent = years[currentYearIndex]; }

// (Rest of your DEA layer creation, chart, legend, sidebar, tabs, slider, and play logic stays exactly as in your original HTML)
// Just make sure the code inside your <script> after map loading is identical to your previous version

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NI DEA Life Expectancy</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Chart.js + Annotation -->
<script src="https://unpkg.com/chart.js@4.3.0/dist/chart.umd.js"></script>
<script src="https://unpkg.com/chartjs-plugin-annotation@3.0.1"></script>
<script>
  Chart.register(window.chartjsPluginAnnotation);
</script>

<style>
body { margin:0; font-family:Arial,sans-serif; }
#map { height:100vh; }

.controls {
  position:absolute; top:10px; left:10px;
  z-index:1000; background:#fff;
  padding:10px; border-radius:6px;
  box-shadow:0 2px 6px rgba(0,0,0,0.3);
  width:300px;
}

.tabs button {
  margin:2px; padding:6px 10px;
  border:none; border-radius:4px;
  cursor:pointer; background:#eee;
}
.tabs button.active { background:#0078A8; color:#fff; }

#sidebar {
  position:absolute; right:10px; top:10px;
  width:360px; z-index:1000;
  background:#fff; padding:12px;
  border-radius:6px;
  box-shadow:0 2px 6px rgba(0,0,0,0.3);
  display:none;
}
#chart-container { height:220px; }

.legend {
  background:#fff; padding:8px;
  border-radius:4px; font-size:12px;
}
.legend i {
  width:18px; height:18px;
  display:inline-block;
  margin-right:6px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="controls">
  <div class="tabs">
    <button id="tab-males" class="active">Males</button>
    <button id="tab-females">Females</button>
  </div>

  <input type="range" id="year-slider" min="0" step="1" value="0" style="width:100%">
  <div id="year-label"></div>
  <button id="play-btn">▶ Play Years</button>
</div>

<div id="sidebar">
  <button id="close-sidebar" style="float:right">Close</button>
  <h3 id="sidebar-title"></h3>
  <div id="sidebar-meta"></div>
  <div id="chart-container"><canvas id="deaChart"></canvas></div>
</div>

<script>
const geojsonUrl = 'DEA_data.geojson';
const colors = ["#28326f","#25588e","#2285b3","#86bad4","#dee8f1"];


let years=[], currentYearIndex=0, selectedSex='Males';
let deaLayer, deaChart, deaData;
let hoveredFeature=null, playInterval=null;

/* MAP */
const map = L.map('map',{minZoom:7.6,maxZoom:13.5}).setView([54.7,-6.6],8);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png').addTo(map);

/* LEGEND */
const legend = L.control({position:'bottomright'});
legend.onAdd = () => {
  const div=L.DomUtil.create('div','legend');
  div.id='legend-content';
  return div;
};
legend.addTo(map);

/* LOAD DATA */
fetch(geojsonUrl).then(r=>r.json()).then(data=>{
  deaData=data;

  const yearSet=new Set();
  data.features.forEach(f=>f.properties.data.forEach(d=>yearSet.add(d.GroupedYear)));
  years=[...yearSet].sort();
  document.getElementById('year-slider').max=years.length-1;
  updateYearLabel();

  deaLayer=L.geoJSON(data,{
    style:f=>({weight:1,color:'#555',fillOpacity:0.85,fillColor:getColor(f)}),
    onEachFeature:(f,l)=>{
      l.on('mouseover',()=>{
        hoveredFeature=f;
        l.setStyle({weight:3,color:'#000'});
        showSidebar(f);
        updateLegendForDEA(f);
      });
      l.on('mouseout',()=>{
        hoveredFeature=null;
        deaLayer.resetStyle(l);
        resetLegend();
      });
    }
  }).addTo(map);

  map.fitBounds(deaLayer.getBounds(),{padding:[20,20]});
  updateLegend();
});

/* HELPERS */
function round1(v){return Math.round(v*10)/10;}

function featureValue(f){
  const r=f.properties.data.find(d=>d.Sex===selectedSex && d.GroupedYear===years[currentYearIndex]);
  return r ? r.Value : null;
}

function getColor(f){
  const v=featureValue(f);
  if(v==null) return '#ccc';
  if(v>80) return colors[6];
  if(v>78) return colors[5];
  if(v>76) return colors[4];
  if(v>74) return colors[3];
  return colors[1];
}

/* LEGEND SYNC */
function updateLegend(){
  document.getElementById('legend-content').innerHTML=
    `<b>${selectedSex} – ${years[currentYearIndex]}</b><br>
     <i style="background:${colors[3]}"></i> 74–76<br>
     <i style="background:${colors[4]}"></i> 76–78<br>
     <i style="background:${colors[5]}"></i> 78–80<br>
     <i style="background:${colors[6]}"></i> 80+`;
}

function updateLegendForDEA(f){
  const v=featureValue(f);
  document.getElementById('legend-content').innerHTML=
    `<b>${f.properties.finalr_dea}</b><br>
     ${selectedSex} – ${years[currentYearIndex]}<br><br>
     <b>Value:</b> ${round1(v)} yrs`;
}

function resetLegend(){ updateLegend(); }

/* SIDEBAR + CHART */
function showSidebar(f){
  document.getElementById('sidebar').style.display='block';
  document.getElementById('sidebar-title').textContent=f.properties.finalr_dea;
  document.getElementById('sidebar-meta').innerHTML=
    `${selectedSex}<br>Year: ${years[currentYearIndex]}`;

  const ts=f.properties.data.filter(d=>d.Sex===selectedSex)
    .sort((a,b)=>a.GroupedYear.localeCompare(b.GroupedYear));

  const labels=ts.map(d=>d.GroupedYear);
  const values=ts.map(d=>round1(d.Value));
  const selIndex=labels.indexOf(years[currentYearIndex]);

  if(deaChart) deaChart.destroy();
  deaChart=new Chart(document.getElementById('deaChart'),{
    type:'line',
    data:{labels,datasets:[{
      data:values,borderColor:'#0078A8',
      tension:0.3,pointRadius:3
    }]},
    options:{
      animation:false,
      plugins:{
        annotation:{
          annotations:{
            line:{type:'line',xMin:selIndex,xMax:selIndex,borderDash:[4,4]}
          }
        }
      }
    }
  });
}

/* SLIDER + PLAY */
function updateAll(){
  updateYearLabel();
  deaLayer.eachLayer(l=>{
    l.setStyle({fillColor:getColor(l.feature)});
  });
  if(hoveredFeature){
    showSidebar(hoveredFeature);
    updateLegendForDEA(hoveredFeature);
  } else {
    updateLegend();
  }
}

document.getElementById('year-slider').oninput=e=>{
  currentYearIndex=+e.target.value;
  updateAll();
};

document.getElementById('play-btn').onclick=()=>{
  if(playInterval){
    clearInterval(playInterval); playInterval=null;
    document.getElementById('play-btn').textContent='▶ Play Years';
  } else {
    document.getElementById('play-btn').textContent='⏸ Pause';
    playInterval=setInterval(()=>{
      currentYearIndex=(currentYearIndex+1)%years.length;
      document.getElementById('year-slider').value=currentYearIndex;
      updateAll();
    },1200);
  }
};

function updateYearLabel(){
  document.getElementById('year-label').textContent=years[currentYearIndex];
}
</script>

</body>
</html>

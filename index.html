
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>NI DEA Life Expectancy Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Styles -->
  <style>
    :root{
      --control-width: 220px;
      --sidebar-width: 360px;
      --chart-height: 240px;
      --ui-bg: rgba(255,255,255,0.95);
      --accent: #0078A8;
    }

    html,body{
      height:100%; margin:0;
      font-family:Arial, sans-serif;
    }

    #map{
      height:100vh;
      width:100%;
    }

    /* Controls */
    .controls{
      position:absolute;
      top:10px;left:10px;
      width:var(--control-width);
      background:var(--ui-bg);
      padding:10px;
      border-radius:6px;
      box-shadow:0 2px 6px rgba(0,0,0,.18);
      z-index:1100;
    }

    .tabs{ display:flex; gap:6px; }
    .tabs button{
      flex:1;
      padding:6px;
      border:none;
      background:#eee;
      border-radius:4px;
      cursor:pointer;
      font-size:14px;
    }
    .tabs button.active{
      background:var(--accent);
      color:#fff;
    }

    #year-slider{
      width:100%;
      margin-top:10px;
    }

    /* Period label */
    #period-line{
      margin-top:6px;
      font-size:14px;
      color:#333;
    }
    #period-line .period-label{
      font-weight:400;
      margin-right:4px;
    }
    #period-line .period-value{
      font-weight:700; /* bold year */
    }

    #play-btn{
      width:100%;
      margin-top:10px;
      padding:7px;
      background:#eee;
      border:none;
      border-radius:4px;
      cursor:pointer;
      font-size:14px;
    }

    /* Legend */
    .legend{
      background:var(--ui-bg);
      border-radius:6px;
      padding:8px;
      box-shadow:0 1px 4px rgba(0,0,0,.15);
      font-size:13px;
      line-height:1.3;
    }
    .legend-item{
      display:flex;
      align-items:center;
      gap:6px;
      margin-bottom:4px;
    }
    .legend-swatch{
      width:18px;height:14px;border-radius:3px;
    }

    /* Sidebar */
    #sidebar{
      position:absolute;
      right:10px;top:10px;
      width:var(--sidebar-width);
      max-height:calc(100vh - 20px);
      overflow-y:auto;
      background:var(--ui-bg);
      padding:10px;
      border-radius:6px;
      box-shadow:0 2px 6px rgba(0,0,0,.18);
      display:none;
      z-index:1200;
    }

    /* NI legend block ABOVE chart */
    #chart-container-top{
      margin-top:12px;
      margin-bottom:8px;
    }

    #ni-average-legend{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:14px;
      color:#444;
      font-weight:400;
      margin-left:2px;
    }

    #ni-average-legend .ni-average-text{
      font-weight:600; /* matches “Period:” label style */
    }

    #ni-average-legend .ni-average-line{
      flex:0 0 160px;
      height:3px;
      background:repeating-linear-gradient(
        to right,
        #444 0px,
        #444 6px,
        transparent 6px,
        transparent 12px
      );
      border-radius:2px;
    }

    /* Chart container */
    #chart-container{
      height:var(--chart-height);
      position:relative;
      overflow:hidden;
    }
    #deaChart{
      width:100% !important;
      height:100% !important;
    }

    /* Label on map */
    .dea-label{
      background:rgba(255,255,255,0.9);
      padding:6px 8px;
      font-weight:bold;
      border-radius:6px;
      box-shadow:0 2px 6px rgba(0,0,0,.35);
      transform:translate(-50%,-50%);
      pointer-events:none;
      white-space:nowrap;
    }

    /* NI Assembly logo */
    #assembly-logo{
      position:absolute;
      bottom:10px;left:10px;
      width:140px;max-width:40%;
      height:auto;
      opacity:.95;
      z-index:1300;
      pointer-events:none;
    }

    @media(max-width:850px){
      #assembly-logo{width:110px;max-width:35%}
      :root{--sidebar-width:300px; --chart-height:200px;}
    }

    @media(max-width:600px){
      #assembly-logo{width:90px;max-width:30%}
      :root{--control-width:200px; --sidebar-width:240px;}
      .legend{display:none}
    }
  </style>
</head>

<body>

<!-- MAP -->
<div id="map"></div>

<!-- NI Assembly logo -->
<img id="assembly-logo" src="NI_Assembly.svg" alt="NI Assembly Logo"/>

<!-- Controls -->
<div class="controls">
  <div class="tabs">
    <button id="tab-males" class="active">Males</button>
    <button id="tab-females">Females</button>
  </div>

  <input type="range" id="year-slider" min="0" value="0" step="1"/>

  <!-- Period label (A‑2) -->
  <div id="period-line">
    <span class="period-label">Period:</span>
    <span class="period-value" id="period-value">2008–10</span>
  </div>

  <button id="play-btn">▶ Play Years</button>
</div>

<!-- Sidebar -->
<div id="sidebar">
  <button id="close-sidebar" style="float:right">Close</button>
  <h3 id="sidebar-title"></h3>
  <div id="sidebar-meta"></div>

  <!-- NI legend ABOVE chart -->
  <div id="chart-container-top">
    <div id="ni-average-legend">
      <span class="ni-average-text">NI average:</span>
      <span class="ni-average-line"></span>
    </div>
  </div>

  <!-- Fixed-height chart -->
  <div id="chart-container">
    <canvas id="deaChart"></canvas>
  </div>
</div>

<!-- JS Libraries -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/chart.js@4.3.0/dist/chart.umd.js"></script>
<script src="https://unpkg.com/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
<script>
  Chart.register(window['chartjs-plugin-annotation']);
</script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

<!-- MAIN APP SCRIPT -->
<script>
/******************************************************************************************
 FULL, CLEAN, VALID, WORKING APPLICATION CODE
******************************************************************************************/

const GEOJSON_URL = "DEA_data.geojson";
const SEXES = ["Males","Females"];
const colors=["#28326f","#25588e","#2285b3","#86bad4","#dee8f1"];

let selectedSex="Males";
let years=[];
let currentYearIndex=0;

let map, deaLayer;
let lastSelectedLayer=null;
let selectedLabelMarker=null;

let deaChart=null;
let playInterval=null;

const valuesBySexDEAYear={Males:{},Females:{},};
const centroidByDEA={};
const statsBySex={Males:null,Females:null};
const niAvgBySex={Males:[],Females:[]};

const elPeriodValue=document.getElementById("period-value");
const elYearSlider=document.getElementById("year-slider");
const elSidebar=document.getElementById("sidebar");

/* ---------------- MAP ---------------- */
map=L.map("map",{preferCanvas:true}).setView([54.7,-6.6],8);
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",{
  attribution:"&copy; OpenStreetMap & Carto"
}).addTo(map);

/* Legend */
const legend=L.control({position:"bottomright"});
legend.onAdd=()=>{
  const div=L.DomUtil.create("div","legend");
  div.innerHTML=`
    <div id="legend-title" style="font-weight:bold;margin-bottom:6px;"></div>
    <div id="legend-body"></div>`;
  return div;
};
legend.addTo(map);

/* ------------ Load Data & Precompute ------------ */
fetch(GEOJSON_URL)
  .then(r=>r.json())
  .then(data=>{
    /* Extract years */
    const yearSet=new Set();
    data.features.forEach(f=>{
      (f.properties.data||[]).forEach(d=>yearSet.add(String(d.GroupedYear)));
    });
    years=[...yearSet].sort();

    elYearSlider.max=years.length-1;
    elPeriodValue.textContent=years[0];

    /* Build caches */
    data.features.forEach(f=>{
      const DEA=f.properties.finalr_dea;
      const cent=turf.centroid(f).geometry.coordinates;
      centroidByDEA[DEA]=cent;

      (f.properties.data||[]).forEach(d=>{
        const sex=d.Sex;
        const y=String(d.GroupedYear);
        if(!valuesBySexDEAYear[sex][DEA]) valuesBySexDEAYear[sex][DEA]={};
        valuesBySexDEAYear[sex][DEA][y]=d.Value;
      });
    });

    /* Compute stats per sex */
    SEXES.forEach(sex=>{
      const vals=[];
      Object.keys(valuesBySexDEAYear[sex]).forEach(DEA=>{
        years.forEach(y=>{
          const v=valuesBySexDEAYear[sex][DEA][y];
          if(typeof v==="number") vals.push(v);
        });
      });

      const min=Math.min(...vals);
      const max=Math.max(...vals);
      const globalMin=Math.floor(min-1);
      const globalMax=Math.ceil(max+1);

      const step=(max-min)/5;
      const breaks=[
        r(min+step),
        r(min+2*step),
        r(min+3*step),
        r(min+4*step)
      ];

      statsBySex[sex]={globalMin,globalMax,breaks};

      niAvgBySex[sex]=years.map(y=>{
        const rowVals=[];
        Object.keys(valuesBySexDEAYear[sex]).forEach(DEA=>{
          const v=valuesBySexDEAYear[sex][DEA][y];
          if(typeof v==="number") rowVals.push(v);
        });
        return r(rowVals.reduce((a,b)=>a+b,0)/rowVals.length);
      });
    });

    createLayer(data);
    updateLegend();

    const bounds=deaLayer.getBounds();
    map.fitBounds(bounds,{padding:[20,20]});
    map.setMaxBounds(bounds.pad(0.1));
    map.setMinZoom(map.getZoom());
    map.options.maxBoundsViscosity=1.0;
  });

/* ------------ Helpers ------------ */
function r(v){return Math.round(v*10)/10;}
function currentYear(){return years[currentYearIndex];}

function getValue(DEA){
  return valuesBySexDEAYear[selectedSex]?.[DEA]?.[currentYear()] ?? null;
}

function getColor(DEA){
  const v=getValue(DEA);
  if(v==null) return "#ccc";
  const b=statsBySex[selectedSex].breaks;
  if(v<=b[0]) return colors[0];
  if(v<=b[1]) return colors[1];
  if(v<=b[2]) return colors[2];
  if(v<=b[3]) return colors[3];
  return colors[4];
}

function styleFeature(f){
  const DEA=f.properties.finalr_dea;
  return{
    weight:1,color:"#555",
    fillColor:getColor(DEA),
    fillOpacity:0.7
  };
}

/* ------------ Layer & Events ------------ */
function createLayer(geojson){
  deaLayer=L.geoJSON(geojson,{
    style:styleFeature,
    onEachFeature:(f,layer)=>{
      const DEA=f.properties.finalr_dea;

      layer.on("mouseover",()=>{
        layer.bringToFront();
        layer.setStyle({weight:3,color:"#000",fillOpacity:1});
      });

      layer.on("mouseout",()=>{
        if(layer!==lastSelectedLayer) deaLayer.resetStyle(layer);
      });

      layer.on("click",()=>{
        if(lastSelectedLayer && lastSelectedLayer!==layer)
          deaLayer.resetStyle(lastSelectedLayer);

        lastSelectedLayer=layer;
        layer.setStyle({weight:3,color:"#000",fillOpacity:1});

        openSidebar(DEA);
        updateLabel(DEA);
      });
    }
  }).addTo(map);
}

function updateStyles(){
  deaLayer.setStyle(styleFeature);
  if(lastSelectedLayer){
    const DEA=lastSelectedLayer.feature.properties.finalr_dea;
    lastSelectedLayer.setStyle({
      weight:3,color:"#000",fillOpacity:1,
      fillColor:getColor(DEA)
    });
  }
  updateLegend();
}

/* ------------ Legend ------------ */
function updateLegend(){
  const s=statsBySex[selectedSex];
  document.getElementById("legend-title").textContent =
    `${selectedSex} (${currentYear()})`;

  const labels=[
    `${s.globalMin} – ${s.breaks[0]}`,
    `${s.breaks[0]} – ${s.breaks[1]}`,
    `${s.breaks[1]} – ${s.breaks[2]}`,
    `${s.breaks[2]} – ${s.breaks[3]}`,
    `> ${s.breaks[3]}`
  ];

  document.getElementById("legend-body").innerHTML =
    labels.map((lbl,i)=>`
      <div class="legend-item">
        <div class="legend-swatch" style="background:${colors[i]}"></div>
        <div>${lbl}</div>
      </div>`).join("");
}

/* ------------ Label ------------ */
function updateLabel(DEA){
  if(selectedLabelMarker) map.removeLayer(selectedLabelMarker);

  const coords=centroidByDEA[DEA];
  const v=getValue(DEA);

  selectedLabelMarker=L.marker([coords[1],coords[0]],{
    icon:L.divIcon({
      html:`<div class="dea-label">${v==null?'n/a':r(v)}</div>`,
      className:"",
      iconSize:null
    }),
    interactive:false
  }).addTo(map);
}

/* ------------ Sidebar + Chart ------------ */
function openSidebar(DEA){
  const v=getValue(DEA);

  document.getElementById("sidebar-title").textContent=`DEA – ${DEA}`;
  document.getElementById("sidebar-meta").innerHTML=
    `<strong>${selectedSex}</strong><br>
     Period: ${years[0]} → ${years[years.length-1]}<br>
     Current (${currentYear()}): ${v==null?'n/a':r(v)+' yrs'}`;

  buildOrUpdateChart(DEA);
  elSidebar.style.display="block";
}

function buildOrUpdateChart(DEA){
  const deaVals=years.map(y=>valuesBySexDEAYear[selectedSex][DEA][y]??null);
  const niVals = niAvgBySex[selectedSex];
  const s=statsBySex[selectedSex];

  const anno=()=>({
    type:"line",
    xMin:currentYearIndex,
    xMax:currentYearIndex,
    borderDash:[4,4],
    borderColor:"#000"
  });

  if(!deaChart){
    const ctx=document.getElementById("deaChart").getContext("2d");
    deaChart=new Chart(ctx,{
      type:"line",
      data:{
        labels:years,
        datasets:[
          {
            label:"DEA",
            data:deaVals,
            borderColor:"#0078A8",
            backgroundColor:"rgba(0,120,168,0.15)",
            fill:true,
            pointRadius:3,
            tension:0.25
          },
          {
            label:"NI Average",
            data:niVals,
            borderColor:"#444",
            borderDash:[6,6],
            fill:false,
            pointRadius:0,
            tension:0.25
          }
        ]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        animation:false,
        scales:{
          x:{ title:{display:true,text:"Period"} },
          y:{ min:s.globalMin, max:s.globalMax }
        },
        plugins:{
          legend:{display:false},
          annotation:{annotations:{cur:anno()}}
        }
      }
    });
  }
  else{
    deaChart.data.datasets[0].data=deaVals;
    deaChart.data.datasets[1].data=niVals;

    deaChart.options.scales.y.min=s.globalMin;
    deaChart.options.scales.y.max=s.globalMax;

    deaChart.options.plugins.annotation.annotations.cur.xMin=currentYearIndex;
    deaChart.options.plugins.annotation.annotations.cur.xMax=currentYearIndex;

    deaChart.update();
  }
}

function updateChartYear(){
  if(!deaChart) return;
  deaChart.options.plugins.annotation.annotations.cur.xMin=currentYearIndex;
  deaChart.options.plugins.annotation.annotations.cur.xMax=currentYearIndex;
  deaChart.update();
}

/* ------------ UI Events ------------ */
document.getElementById("tab-males").onclick=()=>{
  selectedSex="Males";
  document.getElementById("tab-males").classList.add("active");
  document.getElementById("tab-females").classList.remove("active");
  updateAll();
};

document.getElementById("tab-females").onclick=()=>{
  selectedSex="Females";
  document.getElementById("tab-females").classList.add("active");
  document.getElementById("tab-males").classList.remove("active");
  updateAll();
};

function updateAll(){
  updateStyles();
  updateChartYear();
  if(lastSelectedLayer){
    const DEA=lastSelectedLayer.feature.properties.finalr_dea;
    updateLabel(DEA);
    openSidebar(DEA);
  }
}

elYearSlider.oninput=e=>{
  currentYearIndex=+e.target.value;
  elPeriodValue.textContent=currentYear();
  updateStyles();
  updateChartYear();
  if(lastSelectedLayer){
    const DEA=lastSelectedLayer.feature.properties.finalr_dea;
    updateLabel(DEA);
    openSidebar(DEA);
  }
};

document.getElementById("play-btn").onclick=()=>{
  const btn=document.getElementById("play-btn");
  if(playInterval){
    clearInterval(playInterval);
    playInterval=null;
    btn.textContent="▶ Play Years";
    return;
  }

  btn.textContent="⏸ Pause";

  playInterval=setInterval(()=>{
    currentYearIndex=(currentYearIndex+1)%years.length;
    elYearSlider.value=currentYearIndex;
    elPeriodValue.textContent=currentYear();
    updateStyles();
    updateChartYear();
    if(lastSelectedLayer){
      const DEA=lastSelectedLayer.feature.properties.finalr_dea;
      updateLabel(DEA);
      openSidebar(DEA);
    }
  },1400);
};

document.getElementById("close-sidebar").onclick=()=>{
  elSidebar.style.display="none";
  if(lastSelectedLayer) deaLayer.resetStyle(lastSelectedLayer);
  lastSelectedLayer=null;
  if(selectedLabelMarker) map.removeLayer(selectedLabelMarker);
};

</script>
</body>
</html>

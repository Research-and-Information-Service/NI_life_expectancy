<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NI DEA Life Expectancy Map</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Chart.js -->
<script src="https://unpkg.com/chart.js@4.3.0/dist/chart.umd.js"></script>

<!-- Chart.js Annotation Plugin -->
<script src="https://unpkg.com/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
<script>Chart.register(window['chartjs-plugin-annotation']);</script>

<style>
/* Your existing CSS here (unchanged) */
html,body { height:100%; margin:0; font-family: Arial, sans-serif; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
#map { height:100vh; width:100%; }
/* ...rest of your CSS omitted for brevity */
</style>
</head>
<body>
<div id="map"></div>
<img id="assembly-logo" src="NI_Assembly.svg" alt="NI Assembly Logo" />
<div id="spinner"><div class="spinner-dot"></div><div class="spinner-dot" style="animation-delay:.12s"></div><div class="spinner-dot" style="animation-delay:.24s"></div></div>

<!-- Controls & Sidebar HTML here (unchanged) -->

<script>
/* ===========================
   CONFIG & STATE
=========================== */
const colors = ["#28326f","#25588e","#2285b3","#86bad4","#dee8f1"];
const geojsonUrl = "DEA_data.geojson";
let selectedSex = "Males", years = [], currentYearIndex = 0;
let deaDataCache = null, deaLayer = null, lastSelectedLayer = null, selectedLabelMarker = null;
let deaChart = null, playInterval = null;
let breaks = [], globalMinValue = null, globalMaxValue = null;

/* ===========================
   MAP INIT
=========================== */
const map = L.map('map', { preferCanvas: true }).setView([54.7, -6.6], 8);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap & Carto' }).addTo(map);

/* ===========================
   GEOJSON LOAD
=========================== */
showSpinner(true);
fetch(geojsonUrl)
  .then(r => { if(!r.ok) throw new Error('GeoJSON load failed: '+r.statusText); return r.json(); })
  .then(data => {
    deaDataCache = data;

    // Gather all years
    const yearSet = new Set();
    deaDataCache.features.forEach(f=> (f.properties.data||[]).forEach(d=> yearSet.add(String(d.GroupedYear))));
    years = Array.from(yearSet).sort();
    if(!years.length){ showSpinner(false); alert('No year data found'); return; }
    document.getElementById('year-slider').max = years.length - 1;
    updateYearLabel();

    computeGlobalBounds();
    computeGlobalBreaks();

    createMapLayer();
    updateLegend();

    // -------------------------------
    // Fit map to DEA layer and restrict zoom/pan
    // -------------------------------
    const deaBounds = deaLayer.getBounds();
    map.fitBounds(deaBounds, { padding: [20, 20] });
    map.setMaxBounds(deaBounds.pad(0.1)); // restrict panning outside DEA
    map.setMinZoom(map.getBoundsZoom(deaBounds)); // restrict zoom out
    map.setMaxZoom(14); // optional zoom-in cap

    showSpinner(false);
  })
  .catch(err => { console.error(err); showSpinner(false); alert('Error loading data: ' + (err.message || err)); });

/* ===========================
   HELPER FUNCTIONS
=========================== */
function showSpinner(on=true){ document.getElementById('spinner').style.display = on ? 'block' : 'none'; }
function round1(v){ return (typeof v==='number') ? Math.round(v*10)/10 : v; }
function updateYearLabel(){ document.getElementById('year-label').textContent = years[currentYearIndex]; }
function featureValueForYear(feature, yearIndex=currentYearIndex, sex=selectedSex){
  const year = years[yearIndex];
  const rec = (feature.properties.data||[]).find(d => d.Sex===sex && String(d.GroupedYear) === String(year));
  return rec && typeof rec.Value === 'number' ? rec.Value : null;
}
function computeGlobalBounds(){
  let lo=Infinity, hi=-Infinity;
  deaDataCache.features.forEach(f=> (f.properties.data||[]).forEach(d=> { if(typeof d.Value==='number'){ if(d.Value<lo) lo=d.Value; if(d.Value>hi) hi=d.Value; } }));
  if(!isFinite(lo)||!isFinite(hi)){ globalMinValue=null; globalMaxValue=null; return; }
  globalMinValue=Math.floor(lo-1); globalMaxValue=Math.ceil(hi+1);
}
function computeBreaks(){
  const vals=[];
  deaDataCache.features.forEach(f=> { const rec=(f.properties.data||[]).find(d=>d.Sex===selectedSex && String(d.GroupedYear)===String(years[currentYearIndex])); if(rec&&typeof rec.Value==='number') vals.push(rec.Value); });
  if(!vals.length){ breaks=[]; return; }
  const min=Math.min(...vals), max=Math.max(...vals);
  const step=(max-min)/5; breaks=Array.from({length:4},(_,i)=>round1(min+step*(i+1)));
}
function computeGlobalBreaks(){
  const vals=[];
  deaDataCache.features.forEach(f=> (f.properties.data||[]).forEach(d=> { if(d.Sex===selectedSex&&typeof d.Value==='number') vals.push(d.Value); }));
  if(!vals.length){ breaks=[]; return; }
  const min=Math.min(...vals), max=Math.max(...vals);
  const step=(max-min)/5; breaks=Array.from({length:4},(_,i)=>round1(min+step*(i+1)));
}
function getFeatureColor(feature){
  const v=featureValueForYear(feature);
  if(v==null||!breaks||breaks.length!==4) return '#ccc';
  if(v<=breaks[0]) return colors[0];
  if(v<=breaks[1]) return colors[1];
  if(v<=breaks[2]) return colors[2];
  if(v<=breaks[3]) return colors[3];
  return colors[4];
}

/* ===========================
   MAP LAYER CREATION
=========================== */
function createMapLayer(){
  deaLayer = L.geoJSON(deaDataCache, {
    style: f=>({weight:1,color:'#555',fillColor:getFeatureColor(f),fillOpacity:0.8}),
    onEachFeature:(f,layer)=>{
      layer.on('mouseover',()=>{ layer.bringToFront(); layer.setStyle({weight:3,color:'#000',fillOpacity:1}); });
      layer.on('mouseout',()=>{ if(lastSelectedLayer&&lastSelectedLayer===layer){ layer.setStyle({weight:3,color:'#000',fillOpacity:1}); } else { deaLayer.resetStyle(layer); } });
      layer.on('click',()=>{ if(lastSelectedLayer&&lastSelectedLayer!==layer) deaLayer.resetStyle(lastSelectedLayer); lastSelectedLayer=layer; layer.setStyle({weight:3,color:'#000',fillOpacity:1}); populateSidebar(f); document.getElementById('sidebar').style.display='block'; addOrUpdateLabelForFeature(layer,f); });
    }
  }).addTo(map);
}

/* ===========================
   REST OF YOUR FUNCTIONS (sidebar, chart, legend, UI)
   ===========================
   Keep all the other helper and event functions unchanged
=========================== */
</script>
</body>
</html>

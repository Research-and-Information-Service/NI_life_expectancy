<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NI DEA Life Expectancy Map</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js -->
  <script src="https://unpkg.com/chart.js@4.3.0/dist/chart.umd.js"></script>
  <script src="https://unpkg.com/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <script>Chart.register(window['chartjs-plugin-annotation']);</script>

  <style>
    :root{
      --control-width: 220px;
      --control-font: 13px;
      --sidebar-width: 360px;
      --chart-height: 220px;
      --ui-bg: rgba(255,255,255,0.98);
      --muted: #666;
      --accent: #0078A8;
      --legend-width: 160px;
    }

    html,body { height:100%; margin:0; font-family: Arial, sans-serif; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
    #map { height:100vh; width:100%; }

    /* Controls */
    .controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1200;
      background: var(--ui-bg);
      padding: 8px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
      width: var(--control-width);
      font-size: var(--control-font);
      transition: transform .18s ease, opacity .18s ease;
    }
    .controls.min { transform: translateY(-6px) scale(.98); opacity:.94; }
    .control-toggle { position:absolute; right:6px; top:6px; border:none; background:transparent; cursor:pointer; color:var(--muted); font-size:14px; }

    .tabs { display:flex; gap:6px; margin-bottom:6px; }
    .tabs button { flex:1; padding:6px 8px; border: none; background:#eee; border-radius:4px; cursor:pointer; }
    .tabs button.active { background:var(--accent); color:white; }

    #year-slider { width:100%; margin-top:8px; }
    #year-label { margin-top:6px; font-weight:700; font-size:13px; }
    #play-btn { margin-top:8px; padding:6px 10px; background:#eee; border-radius:4px; cursor:pointer; border:none; }

    .small-note { font-size:12px; color:var(--muted); margin-top:8px; }

    /* Tooltip (info) */
    .info { display:inline-block; border-radius:50%; width:18px; height:18px; text-align:center; line-height:18px; font-size:12px; background:#f0f0f0; color:#333; margin-left:6px; cursor:help; position:relative; }
    .info-tip { display:none; position:absolute; left:22px; top:-6px; width:240px; background:#fff; border:1px solid #ddd; padding:8px; font-size:12px; color:#222; border-radius:4px; box-shadow:0 2px 6px rgba(0,0,0,0.12); z-index:2500; }
    .info:hover .info-tip { display:block; }

    /* Legend */
    .legend { width:auto; min-width:0; padding:6px 8px; line-height:1.3; font-size:12px; background:rgba(255,255,255,0.95); border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,0.12); }
    .legend-header { display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:4px; }
    .legend-item { display:flex; align-items:center; gap:4px; margin-bottom:4px; }
    .legend-swatch { width:18px; height:14px; border-radius:3px; flex:0 0 auto; }
    .legend-item > div { white-space:nowrap; }

    /* Sidebar */
    #sidebar { position:absolute; right:10px; top:10px; z-index:1200; width:var(--sidebar-width); max-height:calc(100vh - 20px); overflow:auto; background:var(--ui-bg); padding:10px; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,0.18); display:none; }
    #sidebar h3 { margin:0 0 6px 0; font-size:16px; }
    #sidebar-meta { margin-bottom:8px; color:var(--muted); font-size:13px; }
    #chart-container { height:var(--chart-height); }

    /* DEA label */
    .dea-label { display:inline-block; font-weight:700; font-size:13px; line-height:1; padding:6px 8px; border-radius:6px; background:rgba(255,255,255,0.9); color:#111; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,0.2); text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff; transform:translate(-50%,-50%); pointer-events:none; }

    /* Spinner */
    #spinner { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2000; display:none; }
    .spinner-dot { width:14px; height:14px; margin:4px; border-radius:50%; background:var(--accent); display:inline-block; animation: spin 0.9s linear infinite; }
    @keyframes spin { 0%{transform:scale(1);}50%{transform:scale(.45);}100%{transform:scale(1);} }

    /* Logo */
    #assembly-logo { position:absolute; bottom:10px; left:10px; width:120px; z-index:1100; opacity:0.95; pointer-events:none; }

    @media (max-width:900px){ :root{ --control-width:260px; --sidebar-width:300px; --chart-height:180px; --control-font:13px; --legend-width:140px; } #assembly-logo{ width:98px; } }
    @media (max-width:650px){ :root{ --control-width:200px; --sidebar-width:240px; --chart-height:150px; --control-font:12px; --legend-width:120px; } .controls{ left:8px; top:8px; padding:6px; } .controls.min{ transform:none; opacity:1; } .legend{ display:none; } #assembly-logo{ width:86px; left:8px; bottom:8px; } }

  </style>
</head>
<body>

<div id="map"></div>
<img id="assembly-logo" src="NI_Assembly.svg" alt="NI Assembly Logo" />
<div id="spinner"><div class="spinner-dot"></div><div class="spinner-dot" style="animation-delay:.12s"></div><div class="spinner-dot" style="animation-delay:.24s"></div></div>

<div class="controls" id="controls" role="region" aria-label="Map controls">
  <button class="control-toggle" id="controls-toggle" title="Collapse controls">▾</button>
  <div class="tabs" role="tablist" aria-label="Sex selection">
    <button id="tab-males" class="active" aria-selected="true">Males</button>
    <button id="tab-females" aria-selected="false">Females</button>
  </div>
  <input type="range" id="year-slider" min="0" max="0" step="1" aria-label="Year slider" />
  <div id="year-label" aria-live="polite"></div>
  <button id="play-btn" aria-pressed="false">▶ Play Years</button>
</div>

<div id="sidebar" aria-live="polite" role="region" aria-label="DEA details">
  <button id="close-sidebar" style="float:right">Close</button>
  <h3 id="sidebar-title"></h3>
  <div id="sidebar-meta"></div>
  <div id="chart-container">
    <div id="ni-average-label">
      <span>NI average:</span>
      <span class="ni-average-line"></span>
    </div>
    <canvas id="deaChart"></canvas>
  </div>
</div>

<script>
const colors = ["#28326f","#25588e","#2285b3","#86bad4","#dee8f1"];
const geojsonUrl = "DEA_data.geojson";
let selectedSex="Males", years=[], currentYearIndex=0, deaDataCache=null, deaLayer=null, lastSelectedLayer=null, selectedLabelMarker=null, deaChart=null, playInterval=null, breaks=[], globalMinValue=null, globalMaxValue=null;

const map = L.map('map', { preferCanvas:true }).setView([54.7,-6.6],8);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',{ attribution:'&copy; OpenStreetMap & Carto' }).addTo(map);

function showSpinner(on=true){ document.getElementById('spinner').style.display = on?'block':'none'; }

fetch(geojsonUrl).then(r=>{if(!r.ok) throw new Error('GeoJSON load failed'); return r.json();})
.then(data=>{
  deaDataCache = data;
  const yearSet = new Set();
  deaDataCache.features.forEach(f=>{(f.properties.data||[]).forEach(d=>yearSet.add(String(d.GroupedYear)));});
  years = Array.from(yearSet).sort();
  if(years.length===0){ showSpinner(false); alert('No year data found'); return; }
  document.getElementById('year-slider').max=years.length-1;
  updateYearLabel();
  computeGlobalBounds(); computeGlobalBreaks();
  createMapLayer();
  updateLegend();

  // FIT map to DEA data (allow zoom out)
  const bounds = deaLayer.getBounds();
  map.fitBounds(bounds, { padding:[20,20] });
  map.setMaxZoom(14); // optional max zoom
  showSpinner(false);
}).catch(err=>{ console.error(err); showSpinner(false); alert('Error loading data: '+err.message); });

function computeGlobalBounds(){
  let lo=Infinity, hi=-Infinity;
  deaDataCache.features.forEach(f=>{(f.properties.data||[]).forEach(d=>{if(typeof d.Value==='number'){ if(d.Value<lo) lo=d.Value; if(d.Value>hi) hi=d.Value;}});});
  globalMinValue = isFinite(lo)? Math.floor(lo-1):null;
  globalMaxValue = isFinite(hi)? Math.ceil(hi+1):null;
}
function computeGlobalBreaks(){
  const vals=[]; deaDataCache.features.forEach(f=>{(f.properties.data||[]).forEach(d=>{ if(d.Sex===selectedSex && typeof d.Value==='number') vals.push(d.Value);});});
  if(!vals.length){ breaks=[]; return; }
  const min=Math.min(...vals), max=Math.max(...vals), step=(max-min)/5;
  breaks=Array.from({length:4},(_,i)=> Math.round((min+step*(i+1))*10)/10);
}
function featureValueForYear(feature, yearIndex=currentYearIndex, sex=selectedSex){
  const year=years[yearIndex];
  const rec=(feature.properties.data||[]).find(d=>d.Sex===sex && String(d.GroupedYear)===String(year));
  return rec && typeof rec.Value==='number'? rec.Value:null;
}
function getFeatureColor(feature){
  const v = featureValueForYear(feature);
  if(v==null || !breaks || breaks.length!==4) return '#ccc';
  if(v<=breaks[0]) return colors[0];
  if(v<=breaks[1]) return colors[1];
  if(v<=breaks[2]) return colors[2];
  if(v<=breaks[3]) return colors[3];
  return colors[4];
}

function createMapLayer(){
  deaLayer=L.geoJSON(deaDataCache,{
    style: f=>({weight:1,color:'#555',fillColor:getFeatureColor(f),fillOpacity:0.8}),
    onEachFeature: (f,l)=>{
      l.on('mouseover',()=>{ l.bringToFront(); l.setStyle({weight:3,color:'#000',fillOpacity:1}); });
      l.on('mouseout',()=>{ if(lastSelectedLayer && lastSelectedLayer===l) l.setStyle({weight:3,color:'#000',fillOpacity:1}); else deaLayer.resetStyle(l); });
      l.on('click', ()=>{
        if(lastSelectedLayer && lastSelectedLayer!==l) deaLayer.resetStyle(lastSelectedLayer);
        lastSelectedLayer=l; l.setStyle({weight:3,color:'#000',fillOpacity:1});
        populateSidebar(f); document.getElementById('sidebar').style.display='block';
        addOrUpdateLabelForFeature(l,f);
      });
    }
  }).addTo(map);
}

function addOrUpdateLabelForFeature(layer,feature){
  if(selectedLabelMarker) map.removeLayer(selectedLabelMarker);
  const center = layer.getBounds().getCenter();
  const val = featureValueForYear(feature);
  const html=`<div class="dea-label">${val!=null?Math.round(val*10)/10:'n/a'}</div>`;
  selectedLabelMarker=L.marker(center,{icon:L.divIcon({html:html,className:'dea-label-container',iconSize:null}),interactive:false}).addTo(map);
}
function removeLabel(){ if(selectedLabelMarker){ map.removeLayer(selectedLabelMarker); selectedLabelMarker=null; } }
function refreshSelectedLabel(){ if(!lastSelectedLayer) return; addOrUpdateLabelForFeature(lastSelectedLayer,lastSelectedLayer.feature); }

function updateLegend(){
  const title=document.getElementById('legend-title'), body=document.getElementById('legend-body');
  if(!title||!body) return;
  const minDisplay=globalMinValue!=null?globalMinValue:'n/a', maxDisplay=globalMaxValue!=null?globalMaxValue:'n/a';
  title.textContent=`${selectedSex} (${years[currentYearIndex]})`;
  if(!breaks || breaks.length!==4){ body.innerHTML=`<small>Range: ${minDisplay} to ${maxDisplay} years</small><br><br><div>No break data</div>`; return; }
  const labels=[`${minDisplay}–${breaks[0]}`,`${breaks[0]}–${breaks[1]}`,`${breaks[1]}–${breaks[2]}`,`${breaks[2]}–${breaks[3]}`,`> ${breaks[3]}`];
  let html=`<small>Range: ${minDisplay} to ${maxDisplay} years</small><br><br>`;
  for(let i=0;i<5;i++) html+=`<div class="legend-item" style="opacity:1"><div class="legend-swatch" style="background:${colors[i]}"></div><div>${labels[i]}</div></div>`;
  body.innerHTML=html;
}

function updateYearLabel(){ document.getElementById('year-label').textContent=years[currentYearIndex]; }
function populateSidebar(feature){
  const props=feature.properties||{}, cur=featureValueForYear(feature);
  document.getElementById('sidebar-title').textContent=`DEA – ${props.finalr_dea||'Unknown'}`;
  document.getElementById('sidebar-meta').innerHTML=`<strong>${selectedSex}</strong><br>Period: ${years[0]} → ${years[years.length-1]}<br>Current (${years[currentYearIndex]}): ${cur!=null?Math.round(cur*10)/10+' yrs':'n/a'}`;
  buildChart(feature);
}

/* Build Chart omitted here for brevity — use your existing chart code unchanged */

</script>
</body>
</html>

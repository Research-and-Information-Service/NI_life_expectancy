
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NI DEA Life Expectancy Map</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js -->
  <script src="https://unpkg.com/chart.js@4.3.0/dist/chart.umd.js"></script>

 /chartjs-plugin-annotation.min.js"></script>
  <script>Chart.register(window['chartjs-plugin-annotation']);</script>

  <style>
    :root{
      --control-width: 220px;
      --control-font: 13px;
      --sidebar-width: 360px;
      --chart-height: 220px;
      --ui-bg: rgba(255,255,255,0.98);
      --muted: #666;
      --accent: #0078A8;
      --legend-width: 160px;
    }

    html,body { height:100%; margin:0; font-family: Arial, sans-serif; }
    #map { height:100vh; width:100%; }

    /* Controls */
    .controls {
      position: absolute;
      top: 10px; left: 10px;
      z-index: 1200;
      background: var(--ui-bg);
      padding: 8px;
      border-radius: 6px;
      width: var(--control-width);
      font-size: var(--control-font);
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
    }
    .control-toggle { position:absolute; right:6px; top:6px; border:none; background:transparent; cursor:pointer; color:var(--muted); font-size:14px; }

    .tabs { display:flex; gap:6px; margin-bottom:6px; }
    .tabs button { flex:1; padding:6px 8px; border:none; background:#eee; border-radius:4px; cursor:pointer; }
    .tabs button.active { background:var(--accent); color:white; }

    #year-slider { width:100%; margin-top:8px; }
    #year-label { margin-top:6px; font-weight:700; }
    #play-btn { margin-top:8px; width:100%; padding:6px; border:none; background:#eee; border-radius:4px; cursor:pointer; }

    /* Legend */
    .legend {
      padding: 6px 8px; 
      background: rgba(255,255,255,0.95);
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
      font-size: 12px;
      line-height: 1.3;
    }

    .legend-item { display:flex; align-items:center; gap:4px; margin-bottom:4px; }
    .legend-swatch { width:18px; height:14px; border-radius:3px; }

    /* Sidebar */
    #sidebar {
      position:absolute; right:10px; top:10px;
      z-index:1200;
      width:var(--sidebar-width);
      background:var(--ui-bg);
      padding:10px;
      border-radius:6px;
      box-shadow:0 2px 6px rgba(0,0,0,0.18);
      display:none;
    }
    #chart-container { height:var(--chart-height); }

    .dea-label {
      display:inline-block; font-weight:700; font-size:13px;
      padding:6px 8px;
      border-radius:6px;
      background:rgba(255,255,255,0.9); color:#111;
      text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff;
      box-shadow:0 1px 4px rgba(0,0,0,0.2);
      transform:translate(-50%,-50%);
      pointer-events:none;
    }

    /* Spinner */
    #spinner { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:none; }

    /* Logo */
    #assembly-logo { position:absolute; bottom:10px; left:10px; width:120px; opacity:0.95; pointer-events:none; }
  </style>
</head>

<body>

<div id="map"></div>
<img id="assembly-logo" src="NI_Assembly.svg" />

<div id="spinner"><div>Loading…</div></div>

<!-- Controls -->
<div class="controls" id="controls">
  <button class="control-toggle" id="controls-toggle">▾</button>

  <div class="tabs">
    <button id="tab-males" class="active">Males</button>
    <button id="tab-females">Females</button>
  </div>

  <input type="range" id="year-slider" min="0" step="1" />
  <div id="year-label"></div>

  <button id="play-btn">▶ Play Years</button>
</div>

<!-- Sidebar -->
<div id="sidebar">
  <button id="close-sidebar" style="float:right">Close</button>
  <h3 id="sidebar-title"></h3>
  <div id="sidebar-meta"></div>
  <div id="chart-container">
    <canvas id="deaChart"></canvas>
  </div>
</div>

<script>
/* ==============================
   CONFIG & STATE
============================== */
const colors = ["#28326f","#25588e","#2285b3","#86bad4","#dee8f1"];
const geojsonUrl = "DEA_data.geojson";

let selectedSex = "Males";
let years = [];
let currentYearIndex = 0;

let deaDataCache = null;
let deaLayer = null;
let lastSelectedLayer = null;
let selectedLabelMarker = null;

let globalMinValue = null;
let globalMaxValue = null;
let breaks = []; // 4 breakpoints

let deaChart = null;
let playInterval = null;


/* ==============================
   MAP INIT
============================== */
const map = L.map('map',{preferCanvas:true}).setView([54.7,-6.6],8);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',{
  attribution: '&copy; OpenStreetMap & Carto'
}).addTo(map);

const legendControl = L.control({position:'bottomright'});
legendControl.onAdd = () => {
  const div = L.DomUtil.create('div','legend');
  div.id = 'legend-control';
  div.innerHTML = `
      <div id="legend-title" style="font-weight:700;margin-bottom:6px;"></div>
      <div id="legend-body"></div>
  `;
  return div;
};
legendControl.addTo(map);

function showSpinner(on=true){ 
  document.getElementById('spinner').style.display = on ? 'block':'none';
}

/* ==============================
   LOAD GEOJSON
============================== */
showSpinner();
fetch(geojsonUrl)
  .then(r => r.json())
  .then(data => {
    deaDataCache = data;

    // extract ordered years
    const yearSet = new Set();
    data.features.forEach(f => {
      (f.properties.data||[]).forEach(d => yearSet.add(String(d.GroupedYear)));
    });
    years = Array.from(yearSet).sort();
    document.getElementById('year-slider').max = years.length - 1;
    document.getElementById('year-label').textContent = years[0];

    computeGlobalBounds();
    computeGlobalBreaks();

    createMapLayer();
    updateLegend();

    const bounds = deaLayer.getBounds();
    map.fitBounds(bounds,{padding:[18,18]});

    map.setMaxBounds(bounds.pad(0.1));
    map.setMinZoom(map.getZoom());
    map.options.maxBoundsViscosity = 1.0;

    showSpinner(false);
  });

/* ==============================
   HELPERS
============================== */

function round1(v){ return Math.round(v*10)/10; }

function featureValueForYear(feature){
  const y = years[currentYearIndex];
  const rec = (feature.properties.data||[])
      .find(d => d.Sex===selectedSex && String(d.GroupedYear)===String(y));
  return rec ? rec.Value : null;
}

function computeGlobalBounds(){
  let lo = Infinity, hi = -Infinity;
  deaDataCache.features.forEach(f => {
    (f.properties.data||[]).forEach(d => {
      if (typeof d.Value === 'number'){
        lo = Math.min(lo,d.Value);
        hi = Math.max(hi,d.Value);
      }
    });
  });
  globalMinValue = Math.floor(lo - 1);
  globalMaxValue = Math.ceil(hi + 1);
}

function computeGlobalBreaks(){
  const vals = [];
  deaDataCache.features.forEach(f => {
    (f.properties.data||[]).forEach(d => {
      if (d.Sex===selectedSex && typeof d.Value==='number'){
        vals.push(d.Value);
      }
    });
  });

  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const step = (max - min) / 5;
  breaks = [
    round1(min + step),
    round1(min + step*2),
    round1(min + step*3),
    round1(min + step*4)
  ];
}

function getFeatureColor(feature){
  const v = featureValueForYear(feature);
  if (v==null) return '#ccc';
  if (v <= breaks[0]) return colors[0];
  if (v <= breaks[1]) return colors[1];
  if (v <= breaks[2]) return colors[2];
  if (v <= breaks[3]) return colors[3];
  return colors[4];
}

/* ==============================
   MAP LAYER
============================== */

function createMapLayer(){
  deaLayer = L.geoJSON(deaDataCache,{
    style: f => ({
      weight:1, color:'#555',
      fillColor:getFeatureColor(f),
      fillOpacity:0.8
    }),
    onEachFeature:(feature,layer)=>{
      layer.on('mouseover',()=>{
        layer.bringToFront();
        layer.setStyle({weight:3,color:'#000',fillOpacity:1});
      });
      layer.on('mouseout',()=>{
        if (lastSelectedLayer === layer){
          layer.setStyle({weight:3,color:'#000',fillOpacity:1});
        } else {
          deaLayer.resetStyle(layer);
        }
      });
      layer.on('click',()=>{
        if (lastSelectedLayer && lastSelectedLayer !== layer)
          deaLayer.resetStyle(lastSelectedLayer);

        lastSelectedLayer = layer;
        layer.setStyle({weight:3,color:'#000',fillOpacity:1});

        populateSidebar(feature);
        document.getElementById('sidebar').style.display='block';

        addLabel(layer,feature);
      });
    }
  }).addTo(map);
}

function addLabel(layer,feature){
  if (selectedLabelMarker) map.removeLayer(selectedLabelMarker);
  const center = layer.getBounds().getCenter();
  const val = featureValueForYear(feature);
  selectedLabelMarker = L.marker(center,{
    icon:L.divIcon({
      html:`<div class="dea-label">${val==null?'n/a':round1(val)}</div>`,
      className:'',
      iconSize:null
    }),
    interactive:false
  }).addTo(map);
}

function refreshLabel(){
  if (!lastSelectedLayer) return;
  addLabel(lastSelectedLayer,lastSelectedLayer.feature);
}

/* ==============================
   LEGEND
============================== */

function updateLegend(){
  const title = document.getElementById('legend-title');
  const body = document.getElementById('legend-body');

  title.textContent = `${selectedSex} (${years[currentYearIndex]})`;

  const labels = [
    `${globalMinValue} – ${breaks[0]}`,
    `${breaks[0]} – ${breaks[1]}`,
    `${breaks[1]} – ${breaks[2]}`,
    `${breaks[2]} – ${breaks[3]}`,
    `> ${breaks[3]}`
  ];

  body.innerHTML = `
    <small>Global range: ${globalMinValue} to ${globalMaxValue} years</small><br><br>
    ${colors.map((c,i)=>`
      <div class="legend-item">
        <div class="legend-swatch" style="background:${c}"></div>
        <div>${labels[i]}</div>
      </div>
    `).join('')}
  `;
}

/* ==============================
   CHART
============================== */

function computeNIAverage(){
  return years.map(y=>{
    const vals = [];
    deaDataCache.features.forEach(f=>{
      const rec = (f.properties.data||[])
        .find(d=>d.Sex===selectedSex && String(d.GroupedYear)===String(y));
      if (rec) vals.push(rec.Value);
    });
    if (!vals.length) return null;
    return round1(vals.reduce((a,b)=>a+b,0)/vals.length);
  });
}

function buildChart(feature){
  const ctx = document.getElementById('deaChart').getContext('2d');

  const deaRecords = years.map(y=>{
    const rec = (feature.properties.data||[])
      .find(d=>d.Sex===selectedSex && String(d.GroupedYear)===String(y));
    return rec ? round1(rec.Value) : null;
  });

  const niRecords = computeNIAverage();

  if (deaChart) deaChart.destroy();

  deaChart = new Chart(ctx,{
    type:'line',
    data:{
      labels:years,
      datasets:[
        {
          label:feature.properties.finalr_dea,
          data:deaRecords,
          borderColor:'#0078A8',
          backgroundColor:'rgba(0,120,168,0.16)',
          fill:true, pointRadius:3
        },
        {
          label:'NI average',
          data:niRecords,
          borderColor:'#444',
          fill:false,
          borderDash:[5,5],
          pointRadius:0
        }
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      animation:false,
      scales:{
        y:{
          min:globalMinValue,
          max:globalMaxValue,
          title:{display:true,text:'HLE (years)'}
        },
        x:{ title:{display:true,text:'Period'} }
      },
      plugins:{
        legend:{display:false},
        annotation:{
          annotations:{
            currentYearLine:{
              type:'line',
              xMin:currentYearIndex, xMax:currentYearIndex,
              borderColor:'rgba(0,0,0,0.45)',
              borderDash:[4,4],
              borderWidth:1
            }
          }
        }
      }
    }
  });
}

function updateChartYear(){
  if (!deaChart) return;
  const line = deaChart.options.plugins.annotation.annotations.currentYearLine;
  line.xMin = currentYearIndex;
  line.xMax = currentYearIndex;
  deaChart.update();
}

/* ==============================
   SIDEBAR
============================== */

function populateSidebar(feature){
  const props = feature.properties;
  const cur = featureValueForYear(feature);

  document.getElementById('sidebar-title').textContent = `DEA – ${props.finalr_dea}`;
  document.getElementById('sidebar-meta').innerHTML = `
    <strong>${selectedSex}</strong><br>
    Period: ${years[0]} → ${years[years.length-1]}<br>
    Current (${years[currentYearIndex]}): ${cur==null?'n/a':round1(cur)+' yrs'}
  `;

  buildChart(feature);
}

function updateSidebarCurrent(){
  if (!lastSelectedLayer) return;
  populateSidebar(lastSelectedLayer.feature);
}

/* ==============================
   UI EVENTS
============================== */

function updateTabsUI(){
  document.getElementById('tab-males').classList.remove('active');
  document.getElementById('tab-females').classList.remove('active');
  document.getElementById(selectedSex==='Males'?'tab-males':'tab-females').classList.add('active');
}

document.getElementById('tab-males').onclick = ()=>{
  selectedSex = 'Males';
  updateTabsUI();
  computeGlobalBreaks();
  updateMapStyles();
};
document.getElementById('tab-females').onclick = ()=>{
  selectedSex = 'Females';
  updateTabsUI();
  computeGlobalBreaks();
  updateMapStyles();
};

document.getElementById('year-slider').oninput = e=>{
  currentYearIndex = Number(e.target.value);
  document.getElementById('year-label').textContent = years[currentYearIndex];
  updateMapStyles();
  updateChartYear();
  refreshLabel();
  updateSidebarCurrent();
};

document.getElementById('play-btn').onclick = ()=>{
  if (playInterval){
    clearInterval(playInterval);
    playInterval=null;
    document.getElementById('play-btn').textContent='▶ Play Years';
    return;
  }
  document.getElementById('play-btn').textContent='⏸ Pause';

  playInterval = setInterval(()=>{
    currentYearIndex = (currentYearIndex + 1) % years.length;
    document.getElementById('year-slider').value=currentYearIndex;
    document.getElementById('year-label').textContent=years[currentYearIndex];
    updateMapStyles();
    updateChartYear();
    refreshLabel();
    updateSidebarCurrent();
  },1400);
};

document.getElementById('close-sidebar').onclick = ()=>{
  document.getElementById('sidebar').style.display='none';
  if (lastSelectedLayer) deaLayer.resetStyle(lastSelectedLayer);
  lastSelectedLayer=null;
  if (selectedLabelMarker) map.removeLayer(selectedLabelMarker);
};

map.on('click',()=>{
  if (window.innerWidth <= 650){
    document.getElementById('sidebar').style.display='none';
    if (lastSelectedLayer) deaLayer.resetStyle(lastSelectedLayer);
    lastSelectedLayer=null;
    if (selectedLabelMarker) map.removeLayer(selectedLabelMarker);
  }
});

/* Update map styles */
function updateMapStyles(){
  deaLayer.eachLayer(layer=>{
    layer.setStyle({
      fillColor:getFeatureColor(layer.feature)
    });
  });
  if (lastSelectedLayer){
    lastSelectedLayer.setStyle({
      fillColor:getFeatureColor(lastSelectedLayer.feature),
      weight:3,color:'#000',fillOpacity:1
    });
  }
  updateLegend();
}

updateTabsUI();

</script>

</body>
</html>

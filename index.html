<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NI DEA Life Expectancy Map</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js -->
  <script src="https://unpkg.com/chart.js@4.3.0/dist/chart.umd.js"></script>

  <!-- Chart.js Annotation Plugin -->
  <script src="https://unpkg.com/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <script>Chart.register(window['chartjs-plugin-annotation']);</script>

  <style>
    html, body { height:100%; margin:0; font-family: Arial, sans-serif; }
    #map { height:100vh; width:100%; }
    /* ...include your CSS from original HTML here (controls, legend, sidebar, spinner, etc.) ... */
  </style>
</head>
<body>

<div id="map"></div>
<img id="assembly-logo" src="NI_Assembly.svg" alt="NI Assembly Logo" />

<div id="spinner"><div class="spinner-dot"></div><div class="spinner-dot" style="animation-delay:.12s"></div><div class="spinner-dot" style="animation-delay:.24s"></div></div>

<!-- Controls -->
<div class="controls" id="controls">
  <button class="control-toggle" id="controls-toggle">▾</button>
  <div class="tabs">
    <button id="tab-males" class="active">Males</button>
    <button id="tab-females">Females</button>
  </div>
  <input type="range" id="year-slider" min="0" max="0" step="1" />
  <div id="year-label"></div>
  <button id="play-btn">▶ Play Years</button>
</div>

<!-- Sidebar -->
<div id="sidebar">
  <button id="close-sidebar">Close</button>
  <h3 id="sidebar-title"></h3>
  <div id="sidebar-meta"></div>
  <div id="chart-container">
    <div id="ni-average-label">
      <span>NI average:</span>
      <span class="ni-average-line"></span>
    </div>
    <canvas id="deaChart"></canvas>
  </div>
</div>

<script>
/* =========================
   CONFIG & STATE
========================= */
const colors = ["#28326f","#25588e","#2285b3","#86bad4","#dee8f1"];
const geojsonUrl = "DEA_data.geojson";
let selectedSex = "Males";
let years = [];
let currentYearIndex = 0;
let deaDataCache = null;
let deaLayer = null;
let lastSelectedLayer = null;
let selectedLabelMarker = null;
let deaChart = null;
let playInterval = null;
let breaks = [];
let globalMinValue = null;
let globalMaxValue = null;

/* =========================
   MAP INIT
========================= */
let map = L.map('map', { preferCanvas:true }).setView([54.7,-6.6], 8);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap & Carto'
}).addTo(map);

// Function to fit map to DEA layer extent and restrict zoom
function applyBoundsToDEA(layer) {
  const bounds = layer.getBounds();
  map.fitBounds(bounds, { padding: [20,20] });
  const minZoom = map.getBoundsZoom(bounds, true);
  map.setMinZoom(minZoom);
  map.setMaxZoom(14);
}

// =========================
// HELPERS
// =========================
function round1(v){ return (typeof v==='number') ? Math.round(v*10)/10 : v; }
function updateYearLabel(){ document.getElementById('year-label').textContent = years[currentYearIndex]; }

function featureValueForYear(feature, yearIndex=currentYearIndex, sex=selectedSex){
  const year = years[yearIndex];
  const rec = (feature.properties.data||[]).find(d => d.Sex === sex && String(d.GroupedYear) === String(year));
  return rec && typeof rec.Value === 'number' ? rec.Value : null;
}

function computeNIAverage(sex = selectedSex){
  return years.map(y=>{
    const vals = [];
    deaDataCache.features.forEach(f=>{
      const rec = (f.properties.data||[]).find(d=>d.Sex===sex && String(d.GroupedYear)===String(y));
      if (rec && typeof rec.Value === 'number') vals.push(rec.Value);
    });
    return vals.length ? round1(vals.reduce((a,b)=>a+b,0)/vals.length) : null;
  });
}

function computeGlobalBounds(){
  let lo = Infinity, hi = -Infinity;
  deaDataCache.features.forEach(f=>{
    (f.properties.data||[]).forEach(d=>{
      if (typeof d.Value === 'number'){
        if (d.Value < lo) lo = d.Value;
        if (d.Value > hi) hi = d.Value;
      }
    });
  });
  globalMinValue = isFinite(lo)? Math.floor(lo-1) : null;
  globalMaxValue = isFinite(hi)? Math.ceil(hi+1) : null;
}

function computeGlobalBreaks(){
  const vals = [];
  deaDataCache.features.forEach(f=>{
    (f.properties.data||[]).forEach(d=>{
      if (d.Sex === selectedSex && typeof d.Value === 'number') vals.push(d.Value);
    });
  });
  if (!vals.length){ breaks = []; return; }
  const min = Math.min(...vals), max = Math.max(...vals);
  const step = (max - min)/5;
  breaks = Array.from({length:4}, (_,i)=> round1(min + step*(i+1)));
}

function getFeatureColor(feature){
  const v = featureValueForYear(feature);
  if (v == null || !breaks || breaks.length !==4) return '#ccc';
  if (v <= breaks[0]) return colors[0];
  if (v <= breaks[1]) return colors[1];
  if (v <= breaks[2]) return colors[2];
  if (v <= breaks[3]) return colors[3];
  return colors[4];
}

/* =========================
   MAP LAYER
========================= */
function createMapLayer(){
  deaLayer = L.geoJSON(deaDataCache, {
    style: f => ({
      weight:1,
      color:'#555',
      fillColor: getFeatureColor(f),
      fillOpacity:0.8
    }),
    onEachFeature: (feature, layer) => {
      layer.on('mouseover', ()=>{ layer.bringToFront(); layer.setStyle({ weight:3, color:'#000', fillOpacity:1 }); });
      layer.on('mouseout', ()=>{ if(lastSelectedLayer!==layer) deaLayer.resetStyle(layer); else layer.setStyle({weight:3,color:'#000', fillOpacity:1}); });
      layer.on('click', ()=>{ lastSelectedLayer && lastSelectedLayer!==layer && deaLayer.resetStyle(lastSelectedLayer); lastSelectedLayer=layer; layer.setStyle({weight:3,color:'#000', fillOpacity:1}); populateSidebar(feature); document.getElementById('sidebar').style.display='block'; addOrUpdateLabelForFeature(layer, feature); });
    }
  }).addTo(map);
}

/* Label marker */
function addOrUpdateLabelForFeature(layer, feature){
  if(selectedLabelMarker) map.removeLayer(selectedLabelMarker);
  const center = layer.getBounds().getCenter();
  const val = featureValueForYear(feature);
  const html = `<div class="dea-label">${val!=null?round1(val):'n/a'}</div>`;
  selectedLabelMarker = L.marker(center, { icon: L.divIcon({ html, className:'dea-label-container', iconSize:null }), interactive:false }).addTo(map);
}
function removeLabel(){ if(selectedLabelMarker){ map.removeLayer(selectedLabelMarker); selectedLabelMarker=null; } }

/* =========================
   LEGEND
========================= */
function updateLegend(){
  const title = document.getElementById('legend-title');
  const body = document.getElementById('legend-body');
  if(!title||!body) return;

  title.textContent = `${selectedSex} (${years[currentYearIndex]})`;

  let labels = [];
  if(breaks.length===4){
    labels = [
      `${globalMinValue} – ${breaks[0]}`,
      `${breaks[0]} – ${breaks[1]}`,
      `${breaks[1]} – ${breaks[2]}`,
      `${breaks[2]} – ${breaks[3]}`,
      `> ${breaks[3]}`
    ];
    let html = '';
    for(let i=0;i<5;i++){
      html += `<div class="legend-item"><div class="legend-swatch" style="background:${colors[i]}"></div><div>${labels[i]}</div></div>`;
    }
    body.innerHTML = html;
  } else body.innerHTML='<div>No break data</div>';
}

/* =========================
   SIDEBAR CHART
========================= */
function buildChart(feature){
  const ctx = document.getElementById('deaChart').getContext('2d');
  const deaRecords = years.map(y=>{ const rec=(feature.properties.data||[]).find(d=>d.Sex===selectedSex&&String(d.GroupedYear)===String(y)); return rec&&typeof rec.Value==='number'?round1(rec.Value):null; });
  const niRecords = computeNIAverage(selectedSex);
  if(deaChart) deaChart.destroy();
  deaChart = new Chart(ctx, {
    type:'line',
    data:{ labels: years, datasets:[
      { label: feature.properties.finalr_dea||'DEA', data:deaRecords, borderColor:'#0078A8', backgroundColor:'rgba(0,120,168,0.16)', fill:true, pointRadius:3, tension:0.25, borderWidth:2 },
      { label:'Northern Ireland (avg)', data:niRecords, borderColor:'#444', backgroundColor:'transparent', fill:false, borderDash:[5,5], pointRadius:0, tension:0.25, borderWidth:2 }
    ] },
    options:{ responsive:true, maintainAspectRatio:false, animation:false }
  });
}

function populateSidebar(feature){
  document.getElementById('sidebar-title').textContent = `DEA – ${feature.properties.finalr_dea||'Unknown'}`;
  document.getElementById('sidebar-meta').innerHTML = `<strong>${selectedSex}</strong><br>Period: ${years[0]} → ${years[years.length-1]}<br>Current (${years[currentYearIndex]}): ${featureValueForYear(feature)!=null?round1(featureValueForYear(feature))+' yrs':'n/a'}`;
  buildChart(feature);
}

/* =========================
   LOAD GEOJSON
========================= */
showSpinner(true);
fetch(geojsonUrl)
  .then(r=>r.json())
  .then(data=>{
    deaDataCache = data;
    const yearSet = new Set();
    deaDataCache.features.forEach(f=> (f.properties.data||[]).forEach(d=>yearSet.add(String(d.GroupedYear))));
    years = Array.from(yearSet).sort();
    if(!years.length){ showSpinner(false); alert('No year data'); return; }

    document.getElementById('year-slider').max = years.length-1;
    updateYearLabel();

    computeGlobalBounds();
    computeGlobalBreaks();
    createMapLayer();
    updateLegend();
    applyBoundsToDEA(deaLayer);

    showSpinner(false);
  })
  .catch(err=>{ showSpinner(false); alert('Error loading data: '+err.message); });

function showSpinner(on=true){ document.getElementById('spinner').style.display = on?'block':'none'; }

</script>
</body>
</html>

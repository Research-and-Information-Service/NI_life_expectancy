<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NI DEA Life Expectancy Map</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Chart.js -->
<script src="https://unpkg.com/chart.js@4.3.0/dist/chart.umd.js"></script>
<script src="https://unpkg.com/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
<script>Chart.register(window['chartjs-plugin-annotation']);</script>

<style>
  html,body {height:100%; margin:0; font-family:Arial,sans-serif;}
  #map {height:100vh; width:100%;}
  .controls {position:absolute; top:10px; left:10px; z-index:1200; background:rgba(255,255,255,0.98); padding:8px; border-radius:6px;}
  #sidebar {position:absolute; right:10px; top:10px; z-index:1200; width:360px; max-height:calc(100vh-20px); overflow:auto; background:rgba(255,255,255,0.98); padding:10px; border-radius:6px; display:none;}
</style>
</head>
<body>

<div id="map"></div>

<div class="controls" id="controls">
  <div class="tabs">
    <button id="tab-males" class="active">Males</button>
    <button id="tab-females">Females</button>
  </div>
  <input type="range" id="year-slider" min="0" max="0" step="1" />
  <div id="year-label"></div>
  <button id="play-btn">▶ Play Years</button>
</div>

<div id="sidebar">
  <button id="close-sidebar" style="float:right">Close</button>
  <h3 id="sidebar-title"></h3>
  <div id="sidebar-meta"></div>
  <canvas id="deaChart" style="height:220px;"></canvas>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){

/* ===========================
   CONFIG & STATE
=========================== */

const colors = ["#28326f","#25588e","#2285b3","#86bad4","#dee8f1"];
const geojsonUrl = "DEA_data.geojson";

let selectedSex = "Males";
let years = [];
let currentYearIndex = 0;
let deaDataCache = null;
let deaLayer = null;
let lastSelectedLayer = null;
let selectedLabelMarker = null;
let deaChart = null;
let playInterval = null;
let breaks = [];
let globalMinValue = null;
let globalMaxValue = null;
let initialBounds = null; // store DEA bounds to lock zoom out

/* ===========================
   MAP INIT
=========================== */

const map = L.map('map', {preferCanvas:true}).setView([54.7,-6.6],8);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',{
  attribution:'&copy; OpenStreetMap & Carto'
}).addTo(map);

map.setMaxZoom(14);

/* ===========================
   HELPER FUNCTIONS
=========================== */

function showSpinner(on=true){ console.log('spinner',on); }
function round1(v){ return (typeof v==='number')?Math.round(v*10)/10:v; }
function updateYearLabel(){ document.getElementById('year-label').textContent = years[currentYearIndex]; }
function featureValueForYear(feature, yearIndex=currentYearIndex, sex=selectedSex){
  const year = years[yearIndex];
  const rec = (feature.properties.data||[]).find(d=>d.Sex===sex && String(d.GroupedYear)===String(year));
  return rec && typeof rec.Value==='number'?rec.Value:null;
}

/* ===========================
   LOAD GEOJSON
=========================== */

fetch(geojsonUrl)
  .then(r=>r.json())
  .then(data=>{
    deaDataCache = data;

    // collect years
    const yearSet = new Set();
    deaDataCache.features.forEach(f=> (f.properties.data||[]).forEach(d=> yearSet.add(String(d.GroupedYear))));
    years = Array.from(yearSet).sort();
    document.getElementById('year-slider').max = years.length-1;
    updateYearLabel();

    // compute global min/max
    let vals=[];
    deaDataCache.features.forEach(f=> (f.properties.data||[]).forEach(d=>{ if(typeof d.Value==='number') vals.push(d.Value); }));
    if(vals.length){ globalMinValue = Math.floor(Math.min(...vals)-1); globalMaxValue = Math.ceil(Math.max(...vals)+1); }

    // create map layer
    deaLayer = L.geoJSON(deaDataCache,{
      style: f=>({weight:1,color:'#555',fillColor:'#ccc',fillOpacity:0.8}),
      onEachFeature:(feature,layer)=>{
        layer.on('click',()=>{
          if(lastSelectedLayer && lastSelectedLayer!==layer) deaLayer.resetStyle(lastSelectedLayer);
          lastSelectedLayer = layer;
          layer.setStyle({weight:3,color:'#000',fillOpacity:1});
          populateSidebar(feature);
        });
      }
    }).addTo(map);

    // Fit map to DEA data
    initialBounds = deaLayer.getBounds();
    map.fitBounds(initialBounds);

    // Lock zoom out to DEA extent
    const minZoom = map.getBoundsZoom(initialBounds,true);
    map.setMinZoom(minZoom);

  });

/* ===========================
   SIDEBAR & CHART
=========================== */

function populateSidebar(feature){
  const cur = featureValueForYear(feature);
  document.getElementById('sidebar-title').textContent = feature.properties.finalr_dea||'DEA';
  document.getElementById('sidebar-meta').innerHTML = `Current: ${cur!=null?round1(cur)+' yrs':'n/a'}`;
  buildChart(feature);
  document.getElementById('sidebar').style.display='block';
}

function buildChart(feature){
  const ctx = document.getElementById('deaChart').getContext('2d');
  const dataPoints = years.map(y=>{ const r=(feature.properties.data||[]).find(d=>d.Sex===selectedSex && String(d.GroupedYear)===y); return r&&typeof r.Value==='number'?r.Value:null; });
  if(deaChart) deaChart.destroy();
  deaChart = new Chart(ctx,{type:'line',data:{labels:years,datasets:[{label:'DEA',data:dataPoints,borderColor:'#0078A8',fill:false}]},options:{responsive:true,maintainAspectRatio:false}});
}

/* ===========================
   UI EVENTS
=========================== */

document.getElementById('year-slider').addEventListener('input',e=>{
  currentYearIndex = Number(e.target.value);
  updateYearLabel();
  if(lastSelectedLayer) populateSidebar(lastSelectedLayer.feature);
});

document.getElementById('tab-males').addEventListener('click',()=>{
  selectedSex='Males';
  if(lastSelectedLayer) populateSidebar(lastSelectedLayer.feature);
});

document.getElementById('tab-females').addEventListener('click',()=>{
  selectedSex='Females';
  if(lastSelectedLayer) populateSidebar(lastSelectedLayer.feature);
});

document.getElementById('close-sidebar').addEventListener('click',()=>{
  document.getElementById('sidebar').style.display='none';
  if(lastSelectedLayer) deaLayer.resetStyle(lastSelectedLayer);
  lastSelectedLayer=null;
});

}); // end DOMContentLoaded
</script>

</body>
</html>
